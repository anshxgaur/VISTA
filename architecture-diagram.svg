<svg viewBox="0 0 1400 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3B5BDB"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FF"/>
      <stop offset="1" stop-color="#EAF0FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="620" fill="url(#bg)"/>

  <text x="700" y="50" text-anchor="middle" font-size="30" font-weight="700" fill="#1B2559">
    System Architecture — Vector-Based Intelligent Medical Data Lake
  </text>

  <!-- Row 1 boxes -->
  <!-- Box template function replicated manually -->

  <!-- 1. Data Ingestion -->
  <g>
    <rect x="40" y="120" width="200" height="110" rx="14" fill="#3B5BDB"/>
    <text x="140" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Data</text>
    <text x="140" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Ingestion</text>
    <text x="140" y="208" text-anchor="middle" font-size="12" fill="#DCE3FF">Medical reports (PDF/Image/Text)</text>
  </g>

  <!-- 2. OCR / Text Extraction -->
  <g>
    <rect x="280" y="120" width="200" height="110" rx="14" fill="#4C6EF5"/>
    <text x="380" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">OCR / Text</text>
    <text x="380" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Extraction</text>
    <text x="380" y="208" text-anchor="middle" font-size="12" fill="#E4E9FF">Convert scanned docs to raw text</text>
  </g>

  <!-- 3. Embedding Generation -->
  <g>
    <rect x="520" y="120" width="220" height="110" rx="14" fill="#5C7CFA"/>
    <text x="630" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Embedding</text>
    <text x="630" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Generation</text>
    <text x="630" y="208" text-anchor="middle" font-size="12" fill="#E7EBFF">Sentence Transformers (text → vector)</text>
  </g>

  <!-- 4. Cosine Similarity -->
  <g>
    <rect x="780" y="120" width="220" height="110" rx="14" fill="#7048E8"/>
    <text x="890" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Cosine</text>
    <text x="890" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Similarity</text>
    <text x="890" y="208" text-anchor="middle" font-size="12" fill="#EDE6FF">Compare against existing vectors</text>
  </g>

  <!-- 5. Vector Database -->
  <g>
    <rect x="1040" y="120" width="220" height="110" rx="14" fill="#9C36B5"/>
    <text x="1150" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Vector</text>
    <text x="1150" y="182" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Database</text>
    <text x="1150" y="208" text-anchor="middle" font-size="12" fill="#F3DFFF">Qdrant / Milvus storage &amp; indexing</text>
  </g>

  <!-- Arrows row 1 -->
  <path d="M240,175 L278,175" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M480,175 L518,175" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M740,175 L778,175" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M1000,175 L1038,175" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  <!-- connector down from vector DB to row 2 -->
  <path d="M1150,230 L1150,290 L1150,290" stroke="#3B5BDB" stroke-width="3" fill="none"/>
  <path d="M1150,230 L1150,300" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  <!-- Row 2 boxes (reverse direction) -->
  <!-- 6. Cluster Assignment -->
  <g>
    <rect x="1040" y="330" width="220" height="110" rx="14" fill="#9C36B5"/>
    <text x="1150" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Cluster</text>
    <text x="1150" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Assignment</text>
    <text x="1150" y="418" text-anchor="middle" font-size="12" fill="#F3DFFF">Group into existing/new cluster</text>
  </g>

  <!-- 7. Semantic Search -->
  <g>
    <rect x="780" y="330" width="220" height="110" rx="14" fill="#7048E8"/>
    <text x="890" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Semantic</text>
    <text x="890" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Search</text>
    <text x="890" y="418" text-anchor="middle" font-size="12" fill="#EDE6FF">FastAPI backend query engine</text>
  </g>

  <!-- 8. Dashboard -->
  <g>
    <rect x="520" y="330" width="220" height="110" rx="14" fill="#5C7CFA"/>
    <text x="630" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Dashboard</text>
    <text x="630" y="418" text-anchor="middle" font-size="12" fill="#E7EBFF">Streamlit / React UI for clinicians</text>
  </g>

  <!-- 9. Secure Metadata Store -->
  <g>
    <rect x="260" y="330" width="220" height="110" rx="14" fill="#4C6EF5"/>
    <text x="370" y="370" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Metadata</text>
    <text x="370" y="392" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Storage</text>
    <text x="370" y="418" text-anchor="middle" font-size="12" fill="#E4E9FF">PostgreSQL — secure record keeping</text>
  </g>

  <!-- Arrows row 2 (right to left) -->
  <path d="M1038,385 L1002,385" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M778,385 L742,385" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
  <path d="M518,385 L482,385" stroke="#3B5BDB" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

  <!-- Legend / footer note -->
  <text x="700" y="500" text-anchor="middle" font-size="13" fill="#4A5578">
    Flow: Ingestion → OCR → Embedding → Similarity Match → Vector DB → Clustering → Search → Dashboard (with metadata stored securely alongside)
  </text>

  <!-- bottom accent line -->
  <rect x="40" y="540" width="1320" height="4" rx="2" fill="#C9D4FF"/>
  <text x="700" y="580" text-anchor="middle" font-size="14" fill="#6C7799" font-style="italic">
    Vector-Based Intelligent Medical Data Lake Using Cosine Similarity Clustering
  </text>
</svg>
