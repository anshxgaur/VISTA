<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#212B45"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#FBFCFF"/>

  <text x="600" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1B2559">
    How Cosine Similarity Groups Similar Reports
  </text>

  <!-- LEFT PANEL: vector space plot -->
  <g>
    <rect x="50" y="90" width="480" height="400" rx="16" fill="#F4F7FF" stroke="#D8E0FF" stroke-width="2"/>
    <text x="290" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#3B5BDB">Embedding Vector Space</text>

    <!-- axes -->
    <line x1="120" y1="440" x2="480" y2="440" stroke="#9AA5C8" stroke-width="2"/>
    <line x1="120" y1="440" x2="120" y2="160" stroke="#9AA5C8" stroke-width="2"/>

    <!-- origin -->
    <circle cx="120" cy="440" r="4" fill="#212B45"/>

    <!-- Vector A: Report 1 (Cardiology) -->
    <line x1="120" y1="440" x2="330" y2="220" stroke="#3B5BDB" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="345" y="215" font-size="13" fill="#3B5BDB" font-weight="700">Report A</text>
    <text x="345" y="232" font-size="11" fill="#3B5BDB">"chest pain, dyspnea"</text>

    <!-- Vector B: Report 2 (Cardiology, similar) -->
    <line x1="120" y1="440" x2="300" y2="205" stroke="#0CA678" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="180" y="195" font-size="13" fill="#0CA678" font-weight="700">Report B</text>
    <text x="150" y="178" font-size="11" fill="#0CA678">"myocardial infarction"</text>

    <!-- angle arc between A and B (small angle - similar) -->
    <path d="M 190 340 A 90 90 0 0 1 205 320" fill="none" stroke="#0CA678" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="175" y="355" font-size="12" fill="#0CA678" font-weight="600">θ small ≈ high similarity</text>

    <!-- Vector C: Report 3 (unrelated - Orthopedics) -->
    <line x1="120" y1="440" x2="460" y2="410" stroke="#E8590C" stroke-width="4" marker-end="url(#arrowhead)"/>
    <text x="440" y="400" font-size="13" fill="#E8590C" font-weight="700">Report C</text>
    <text x="380" y="460" font-size="11" fill="#E8590C">"fractured femur"</text>

    <!-- angle arc between A and C (large angle - dissimilar) -->
    <path d="M 260 425 A 140 140 0 0 1 300 320" fill="none" stroke="#E8590C" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="300" y="400" font-size="12" fill="#E8590C" font-weight="600">θ large ≈ low similarity</text>
  </g>

  <!-- RIGHT PANEL: formula + result -->
  <g>
    <rect x="570" y="90" width="580" height="400" rx="16" fill="#FFFFFF" stroke="#D8E0FF" stroke-width="2"/>
    <text x="860" y="130" text-anchor="middle" font-size="16" font-weight="700" fill="#3B5BDB">The Formula</text>

    <rect x="640" y="155" width="440" height="70" rx="10" fill="#F4F7FF"/>
    <text x="860" y="198" text-anchor="middle" font-size="22" fill="#1B2559" font-weight="700">cos(θ) = (A · B) / (‖A‖ ‖B‖)</text>

    <text x="600" y="255" font-size="14" fill="#4A5578">Result ranges from -1 to 1:</text>

    <rect x="600" y="270" width="420" height="34" rx="8" fill="#E6FCF5"/>
    <text x="615" y="292" font-size="13" fill="#0CA678" font-weight="600">≈ 1.0 → reports mean nearly the same thing</text>

    <rect x="600" y="312" width="420" height="34" rx="8" fill="#FFF4E6"/>
    <text x="615" y="334" font-size="13" fill="#E8590C" font-weight="600">≈ 0.0 → reports are unrelated</text>

    <rect x="600" y="354" width="420" height="34" rx="8" fill="#FFF0F0"/>
    <text x="615" y="376" font-size="13" fill="#C92A2A" font-weight="600">≈ -1.0 → reports are semantically opposite</text>

    <text x="600" y="420" font-size="13" fill="#4A5578">Key idea: Report A and Report B use different</text>
    <text x="600" y="440" font-size="13" fill="#4A5578">words but describe the same condition — cosine</text>
    <text x="600" y="460" font-size="13" fill="#4A5578">similarity still places them in the same cluster.</text>
  </g>
</svg>
